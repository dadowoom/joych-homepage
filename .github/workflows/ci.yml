name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  check:
    name: Check, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: joych_test_root
          MYSQL_DATABASE: joych_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pjoych_test_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migration ledger
        run: pnpm verify:migrations

      - name: Verify migrations on fresh MySQL
        env:
          DATABASE_URL: mysql://root:joych_test_root@127.0.0.1:3306/joych_migration_test
        run: pnpm db:migrate:safe

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: |
          pnpm test
          pnpm test:audit-uploads

      - name: Build
        run: pnpm build
