name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: joych-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  JOYCH_APP_DIR: ${{ vars.JOYCH_APP_DIR || '/var/www/joych-homepage' }}
  JOYCH_PM2_APP: ${{ vars.JOYCH_PM2_APP || 'joych-homepage' }}
  JOYCH_HEALTHCHECK_URL: ${{ vars.JOYCH_HEALTHCHECK_URL || 'http://127.0.0.1:3000/api/public-config' }}
  JOYCH_READINESS_URL: ${{ vars.JOYCH_READINESS_URL || 'http://127.0.0.1:3000/api/readyz' }}
  JOYCH_HEALTHCHECK_ATTEMPTS: ${{ vars.JOYCH_HEALTHCHECK_ATTEMPTS || '10' }}
  JOYCH_HEALTHCHECK_DELAY_SECONDS: ${{ vars.JOYCH_HEALTHCHECK_DELAY_SECONDS || '3' }}
  JOYCH_HEALTHCHECK_CONNECT_TIMEOUT_SECONDS: ${{ vars.JOYCH_HEALTHCHECK_CONNECT_TIMEOUT_SECONDS || '2' }}
  JOYCH_HEALTHCHECK_MAX_TIME_SECONDS: ${{ vars.JOYCH_HEALTHCHECK_MAX_TIME_SECONDS || '10' }}
  JOYCH_DEPLOY_BACKUP_MIN_COUNT: ${{ vars.JOYCH_DEPLOY_BACKUP_MIN_COUNT || '7' }}
  JOYCH_DEPLOY_BACKUP_MAX_COUNT: ${{ vars.JOYCH_DEPLOY_BACKUP_MAX_COUNT || '14' }}
  JOYCH_DEPLOY_BACKUP_MAX_AGE_DAYS: ${{ vars.JOYCH_DEPLOY_BACKUP_MAX_AGE_DAYS || '30' }}
  JOYCH_ASSET_PRIOR_RELEASE_MIN_COUNT: ${{ vars.JOYCH_ASSET_PRIOR_RELEASE_MIN_COUNT || '2' }}
  JOYCH_ASSET_PRIOR_RELEASE_MAX_COUNT: ${{ vars.JOYCH_ASSET_PRIOR_RELEASE_MAX_COUNT || '7' }}
  JOYCH_ASSET_PRIOR_RELEASE_MAX_AGE_DAYS: ${{ vars.JOYCH_ASSET_PRIOR_RELEASE_MAX_AGE_DAYS || '14' }}
  JOYCH_SSH_PORT: ${{ secrets.JOYCH_SSH_PORT || '22' }}
  JOYCH_SSH_HOST: ${{ secrets.JOYCH_SSH_HOST }}
  JOYCH_SSH_USER: ${{ secrets.JOYCH_SSH_USER }}
  JOYCH_SSH_PASSWORD: ${{ secrets.JOYCH_SSH_PASSWORD }}
  JOYCH_SSH_PRIVATE_KEY: ${{ secrets.JOYCH_SSH_PRIVATE_KEY }}

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Build and Deploy
    runs-on: ubuntu-latest
    # The first legacy praise import validates and inserts more than 5,000 videos.
    # Migration markers make subsequent deployments return quickly.
    timeout-minutes: 60

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: joych_test_root
          MYSQL_DATABASE: joych_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pjoych_test_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migration ledger
        run: pnpm verify:migrations

      - name: Verify migrations on fresh MySQL
        env:
          DATABASE_URL: mysql://root:joych_test_root@127.0.0.1:3306/joych_migration_test
        run: pnpm db:migrate:safe

      - name: Validate deploy scripts
        run: |
          node --check scripts/backup-joych-production.mjs
          node --check scripts/backup-joych-safety.mjs
          node --check scripts/audit-upload-inventory.mjs
          node --check scripts/apply-0110-db-growth-indexes.mjs
          node --check scripts/apply-0111-member-admin-indexes.mjs
          node --check scripts/apply-0112-external-reservation-self-service.mjs
          bash -n scripts/deploy-production-remote.sh
          bash -n scripts/deploy-retention.sh
          bash -n scripts/deploy-retention.test.sh
          bash scripts/deploy-retention.test.sh

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: |
          pnpm test
          pnpm test:audit-uploads
          pnpm test:backup

      - name: Build
        run: pnpm build

      - name: Create deploy artifact
        run: |
          ARTIFACT="joych-homepage-${GITHUB_SHA}.tar.gz"
          tar -czf "${ARTIFACT}" dist package.json pnpm-lock.yaml pnpm-workspace.yaml patches drizzle/*.sql scripts/backup-joych-production.mjs scripts/backup-joych-safety.mjs scripts/audit-upload-inventory.mjs scripts/apply-0110-db-growth-indexes.mjs scripts/apply-0111-member-admin-indexes.mjs scripts/apply-0112-external-reservation-self-service.mjs scripts/deploy-retention.sh scripts/verify-pwa-domain-bridge.mjs
          echo "ARTIFACT=${ARTIFACT}" >> "${GITHUB_ENV}"

      - name: Prepare SSH
        env:
          SSH_HOST: ${{ secrets.JOYCH_SSH_HOST }}
          SSH_USER: ${{ secrets.JOYCH_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.JOYCH_SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.JOYCH_SSH_PASSWORD }}
          SSH_HOST_ED25519_KEY: ${{ secrets.JOYCH_SSH_HOST_ED25519_KEY }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${SSH_HOST}" || -z "${SSH_USER}" || -z "${SSH_HOST_ED25519_KEY}" ]]; then
            echo "Missing required deployment secrets." >&2
            echo "Required: JOYCH_SSH_HOST, JOYCH_SSH_USER, JOYCH_SSH_HOST_ED25519_KEY" >&2
            exit 1
          fi
          if [[ ! "${SSH_HOST}" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]*$ ]]; then
            echo "JOYCH_SSH_HOST contains unsupported characters." >&2
            exit 1
          fi
          if [[ ! "${SSH_USER}" =~ ^[A-Za-z_][A-Za-z0-9._-]*$ ]]; then
            echo "JOYCH_SSH_USER contains unsupported characters." >&2
            exit 1
          fi
          if [[ ! "${JOYCH_SSH_PORT}" =~ ^[0-9]+$ ]] || (( JOYCH_SSH_PORT < 1 || JOYCH_SSH_PORT > 65535 )); then
            echo "JOYCH_SSH_PORT must be between 1 and 65535." >&2
            exit 1
          fi
          if [[ ! "${SSH_HOST_ED25519_KEY}" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || ! printf '%s' "${SSH_HOST_ED25519_KEY}" | base64 --decode >/dev/null 2>&1; then
            echo "JOYCH_SSH_HOST_ED25519_KEY is not a valid base64 host key." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [[ -n "${SSH_PRIVATE_KEY}" ]]; then
            printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/joych_deploy_key
            chmod 600 ~/.ssh/joych_deploy_key
          fi

          if [[ "${JOYCH_SSH_PORT}" == "22" ]]; then
            HOST_TOKEN="${SSH_HOST}"
          else
            HOST_TOKEN="[${SSH_HOST}]:${JOYCH_SSH_PORT}"
          fi
          printf '%s ssh-ed25519 %s\n' \
            "${HOST_TOKEN}" \
            "${SSH_HOST_ED25519_KEY}" \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload artifact
        env:
          SSH_HOST: ${{ secrets.JOYCH_SSH_HOST }}
          SSH_USER: ${{ secrets.JOYCH_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.JOYCH_SSH_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.JOYCH_SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "${SSH_PRIVATE_KEY}" ]]; then
            scp -i ~/.ssh/joych_deploy_key \
              -P "${JOYCH_SSH_PORT}" \
              -o LogLevel=ERROR \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=${HOME}/.ssh/known_hosts" \
              "${ARTIFACT}" \
              "${SSH_USER}@${SSH_HOST}:/tmp/${ARTIFACT}"
          elif [[ -n "${SSH_PASSWORD}" ]]; then
            sudo apt-get update -y >/dev/null
            sudo apt-get install -y sshpass >/dev/null
            export SSHPASS="${SSH_PASSWORD}"
            sshpass -e \
              scp -P "${JOYCH_SSH_PORT}" \
              -o LogLevel=ERROR \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=${HOME}/.ssh/known_hosts" \
              "${ARTIFACT}" \
              "${SSH_USER}@${SSH_HOST}:/tmp/${ARTIFACT}"
          else
            echo "Missing SSH authentication: set JOYCH_SSH_PRIVATE_KEY or JOYCH_SSH_PASSWORD." >&2
            exit 1
          fi

      - name: Run remote deploy
        env:
          SSH_HOST: ${{ secrets.JOYCH_SSH_HOST }}
          SSH_USER: ${{ secrets.JOYCH_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.JOYCH_SSH_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.JOYCH_SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "${SSH_PRIVATE_KEY}" ]]; then
            ssh -i ~/.ssh/joych_deploy_key \
              -p "${JOYCH_SSH_PORT}" \
              -o LogLevel=ERROR \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=${HOME}/.ssh/known_hosts" \
              "${SSH_USER}@${SSH_HOST}" \
              "APP_DIR='${JOYCH_APP_DIR}' PM2_APP='${JOYCH_PM2_APP}' ARTIFACT='/tmp/${ARTIFACT}' HEALTHCHECK_URL='${JOYCH_HEALTHCHECK_URL}' READINESS_URL='${JOYCH_READINESS_URL}' HEALTHCHECK_ATTEMPTS='${JOYCH_HEALTHCHECK_ATTEMPTS}' HEALTHCHECK_DELAY_SECONDS='${JOYCH_HEALTHCHECK_DELAY_SECONDS}' HEALTHCHECK_CONNECT_TIMEOUT_SECONDS='${JOYCH_HEALTHCHECK_CONNECT_TIMEOUT_SECONDS}' HEALTHCHECK_MAX_TIME_SECONDS='${JOYCH_HEALTHCHECK_MAX_TIME_SECONDS}' DEPLOY_BACKUP_MIN_COUNT='${JOYCH_DEPLOY_BACKUP_MIN_COUNT}' DEPLOY_BACKUP_MAX_COUNT='${JOYCH_DEPLOY_BACKUP_MAX_COUNT}' DEPLOY_BACKUP_MAX_AGE_DAYS='${JOYCH_DEPLOY_BACKUP_MAX_AGE_DAYS}' ASSET_PRIOR_RELEASE_MIN_COUNT='${JOYCH_ASSET_PRIOR_RELEASE_MIN_COUNT}' ASSET_PRIOR_RELEASE_MAX_COUNT='${JOYCH_ASSET_PRIOR_RELEASE_MAX_COUNT}' ASSET_PRIOR_RELEASE_MAX_AGE_DAYS='${JOYCH_ASSET_PRIOR_RELEASE_MAX_AGE_DAYS}' bash -s" \
              < scripts/deploy-production-remote.sh
          elif [[ -n "${SSH_PASSWORD}" ]]; then
            export SSHPASS="${SSH_PASSWORD}"
            sshpass -e \
              ssh -p "${JOYCH_SSH_PORT}" \
              -o LogLevel=ERROR \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=${HOME}/.ssh/known_hosts" \
              "${SSH_USER}@${SSH_HOST}" \
              "APP_DIR='${JOYCH_APP_DIR}' PM2_APP='${JOYCH_PM2_APP}' ARTIFACT='/tmp/${ARTIFACT}' HEALTHCHECK_URL='${JOYCH_HEALTHCHECK_URL}' READINESS_URL='${JOYCH_READINESS_URL}' HEALTHCHECK_ATTEMPTS='${JOYCH_HEALTHCHECK_ATTEMPTS}' HEALTHCHECK_DELAY_SECONDS='${JOYCH_HEALTHCHECK_DELAY_SECONDS}' HEALTHCHECK_CONNECT_TIMEOUT_SECONDS='${JOYCH_HEALTHCHECK_CONNECT_TIMEOUT_SECONDS}' HEALTHCHECK_MAX_TIME_SECONDS='${JOYCH_HEALTHCHECK_MAX_TIME_SECONDS}' DEPLOY_BACKUP_MIN_COUNT='${JOYCH_DEPLOY_BACKUP_MIN_COUNT}' DEPLOY_BACKUP_MAX_COUNT='${JOYCH_DEPLOY_BACKUP_MAX_COUNT}' DEPLOY_BACKUP_MAX_AGE_DAYS='${JOYCH_DEPLOY_BACKUP_MAX_AGE_DAYS}' ASSET_PRIOR_RELEASE_MIN_COUNT='${JOYCH_ASSET_PRIOR_RELEASE_MIN_COUNT}' ASSET_PRIOR_RELEASE_MAX_COUNT='${JOYCH_ASSET_PRIOR_RELEASE_MAX_COUNT}' ASSET_PRIOR_RELEASE_MAX_AGE_DAYS='${JOYCH_ASSET_PRIOR_RELEASE_MAX_AGE_DAYS}' bash -s" \
              < scripts/deploy-production-remote.sh
          else
            echo "Missing SSH authentication: set JOYCH_SSH_PRIVATE_KEY or JOYCH_SSH_PASSWORD." >&2
            exit 1
          fi
